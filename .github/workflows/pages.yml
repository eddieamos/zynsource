name: Publish ZynSource website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Embed responsive stylesheet in homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          css_path = Path("assets/adaptive-viewport.css")
          html = p.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")
          if '</head>' not in html:
              raise RuntimeError("Missing HTML head")
          old_link = '<link rel="stylesheet" href="assets/adaptive-viewport.css">'
          html = html.replace(old_link, '')
          marker = '<!-- responsive-layout-v3 -->'
          css_tag = marker + '<style>\\n' + css + '\\n</style>'
          if marker not in html:
              html = html.replace('</head>', css_tag + '\\n</head>', 1)
          if marker not in html or 'FINAL ALIGNMENT FIX' not in html:
              raise RuntimeError("Responsive CSS not embedded")
          p.write_text(html, encoding="utf-8")
          print("Embedded", len(css), "CSS characters")
          PY
      - name: Package website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
