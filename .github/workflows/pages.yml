name: Publish ZynSource website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages if necessary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "404" ]; then
            echo 'Enabling GitHub Pages with workflow build type'
            created=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"build_type":"workflow"}' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
            cat /tmp/create.json
            if [ "$created" != "201" ] && [ "$created" != "409" ]; then exit 1; fi
          elif [ "$code" != "200" ]; then
            cat /tmp/pages.json
            exit 1
          fi
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Package static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
