name: Publish ZynSource website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Apply adaptive viewport stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          marker = '<link rel="stylesheet" href="assets/adaptive-viewport.css">'
          if marker not in html:
              if '</head>' not in html:
                  raise RuntimeError("No HTML head found")
              html = html.replace('</head>', marker + '\n</head>', 1)
              p.write_text(html, encoding="utf-8")
          assert marker in p.read_text(encoding="utf-8")
          PY
      - name: Package website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
