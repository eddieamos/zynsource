name: Publish ZynSource website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Verify multipage site files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = ['index.html', 'how-it-works/index.html', 'platform/index.html', 'real-software/index.html', 'solutions/index.html', 'governance/index.html', 'perspectives/index.html', 'contact/index.html']
          for path in pages:
              html = Path(path).read_text(encoding='utf-8')
              assert '<nav' in html and 'site.css' in html, path
          assert Path('assets/site.css').exists()
          assert Path('assets/site.js').exists()
          print('Verified', len(pages), 'pages')
          PY
      - name: Package website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
